<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="管线示意图：浏览器抽取页面树落盘，脚本经 MCP 服务与中继把画板建进 Figma">
  <style>
    text { font-family: system-ui, "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; rx: 8; }
    .svc { fill: #f2f7ff; stroke: #2f6feb; }
    .art { fill: #f6fbf4; stroke: #3f9b4a; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .lbl { font-size: 12.5px; fill: #2f6feb; }
    .cap { font-size: 13px; fill: #57606a; }
    line, path { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .dash { stroke-dasharray: 5 4; }
  </style>

  <text x="40" y="34" class="t">① 抽取：在浏览器里把原型页变成页面树</text>

  <rect x="40" y="52" width="190" height="62" class="box" rx="8" />
  <text x="58" y="78" class="t">HTML 原型页</text>
  <text x="58" y="98" class="s">浏览器控制台注入脚本</text>

  <rect x="300" y="52" width="230" height="62" class="box svc" rx="8" />
  <text x="318" y="78" class="t">收集服务 :8766</text>
  <text x="318" y="98" class="s">collect-server.ts（绑 127.0.0.1）</text>

  <rect x="600" y="52" width="230" height="62" class="box art" rx="8" />
  <text x="618" y="78" class="t">pages/&lt;页面&gt;.json</text>
  <text x="618" y="98" class="s">页面树，一行一个页面</text>

  <path d="M230 83 H296" marker-end="url(#a)" />
  <text x="216" y="130" class="lbl">注入 extractor.js / batch-extract.js</text>
  <path d="M530 83 H596" marker-end="url(#a)" />
  <text x="536" y="130" class="lbl">回传落盘</text>

  <text x="40" y="168" class="t">② 推送与核对：脚本经中继把画板建进 Figma</text>

  <rect x="40" y="186" width="150" height="62" class="box" rx="8" />
  <text x="58" y="212" class="t">AI 客户端</text>
  <text x="58" y="232" class="s">Cursor / Claude 等</text>

  <rect x="240" y="186" width="150" height="62" class="box svc" rx="8" />
  <text x="258" y="212" class="t">MCP 服务</text>
  <text x="258" y="232" class="s">63 条工具</text>

  <rect x="440" y="186" width="220" height="62" class="box svc" rx="8" />
  <text x="458" y="212" class="t">中继 :3055</text>
  <text x="458" y="232" class="s">socket.ts ＋ 控制台页</text>

  <rect x="710" y="186" width="180" height="62" class="box art" rx="8" />
  <text x="728" y="212" class="t">Figma 插件</text>
  <text x="728" y="232" class="s">开发版 link，画布落地</text>

  <path d="M190 217 H236" marker-end="url(#a)" />
  <text x="196" y="266" class="lbl">stdio</text>
  <path d="M390 217 H436" marker-end="url(#a)" />
  <text x="392" y="266" class="lbl">WebSocket</text>
  <path d="M660 217 H706" marker-end="url(#a)" />
  <text x="650" y="266" class="lbl">同频道广播</text>

  <path d="M715 114 V150 H470 V182" class="dash" marker-end="url(#a)" />
  <text x="478" y="144" class="lbl">build-page.ts / build-batch.ts 读页面树，经 MCP 与中继建画板</text>
  <path d="M830 114 V150 H600 V182" class="dash" marker-end="url(#a)" />
  <text x="608" y="170" class="lbl">check-pushed.ts 对账：缺页、旧页、同名重复</text>

  <text x="40" y="300" class="t">③ 全程在本机</text>
  <text x="40" y="324" class="cap">中继与收集服务只服务本机链路，插件的 networkAccess 只允许 ws://localhost:3055；</text>
  <text x="40" y="346" class="cap">注意中继未绑定回环地址（默认监听所有网卡），共享网络里请自行加防火墙限制。</text>
  <text x="40" y="378" class="cap">版本标识统一为一个号：package.json 的 version、插件上报的 BUILD、门槛期望值三处一致（当前 0.4.0）。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f" />
    </marker>
  </defs>
</svg>
